<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Webradio</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
html, body, * { cursor: none !important; box-sizing: border-box; }
html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0d0f14; color: #eef1f6; font-family: Arial, Helvetica, sans-serif; }
#app { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden;
  background: #14171f; background: -webkit-linear-gradient(top left, #1b1f2b 0%, #0d0f14 70%); background: linear-gradient(135deg, #1b1f2b 0%, #0d0f14 70%); }

/* Kopfzeile / Tabs */
#head { position: absolute; top: 0; left: 0; width: 100%; height: 13%; padding: 2.2vh 3vw 0 3vw; }
#brand { float: left; font-size: 3.4vh; font-weight: bold; letter-spacing: 1px; line-height: 7vh; color: #8fd3ff; margin-right: 4vw; }
#tabs { float: left; }
.tab { display: inline-block; margin-right: 1.2vw; padding: 1.4vh 2.2vw; font-size: 2.8vh; line-height: 4vh; border-radius: 4vh; background: #232836; color: #b9c0cf; border: 0.5vh solid transparent; }
.tab.active { background: #2f6fa8; color: #fff; }
.tab.focus { border-color: #fff; box-shadow: 0 0 2.5vh 0.6vh rgba(120,200,255,0.9); -webkit-transform: scale(1.07); transform: scale(1.07); }
#hint { float: right; font-size: 2vh; color: #6f7788; line-height: 7vh; }

/* Raster */
#grid { position: absolute; top: 13%; bottom: 14%; left: 0; width: 100%; padding: 0 2vw; }
.tile { float: left; width: 25%; padding: 1vh 0.8vw; }
.card { position: relative; width: 100%; height: 100%; border-radius: 2vh; padding: 1.6vh 1.4vw; overflow: hidden;
  background: #1d2230; background: -webkit-linear-gradient(top, #252b3b, #181c27); background: linear-gradient(180deg, #252b3b, #181c27);
  border: 0.6vh solid #2a3042; -webkit-transition: -webkit-transform .12s, box-shadow .12s; transition: transform .12s, box-shadow .12s; }
.tile.focus { position: relative; z-index: 5; }
.tile.focus .card { border-color: #fff; box-shadow: 0 0 3vh 0.8vh rgba(120,200,255,0.95); -webkit-transform: scale(1.05); transform: scale(1.05); background: #2a3350; }
.tile.playing .card { border-color: #46c27a; }
.tile.focus.playing .card { border-color: #fff; }
.logo { float: left; width: 12vh; height: 12vh; border-radius: 1.6vh; background: #dfe4ee; text-align: center; overflow: hidden; margin-right: 1.4vw; }
.logo img { max-width: 86%; max-height: 86%; margin-top: 7%; }
.badge { width: 100%; height: 100%; line-height: 12vh; font-size: 5vh; font-weight: bold; color: #fff; }
.info { overflow: hidden; }
.sname { font-size: 3vh; font-weight: bold; line-height: 3.8vh; max-height: 7.6vh; overflow: hidden; color: #fff; }
.smeta { margin-top: 1vh; font-size: 2.1vh; color: #9aa3b5; }
.eq { position: absolute; right: 1.2vw; bottom: 1.4vh; height: 4vh; width: 4vh; display: none; }
.playing .eq { display: block; }
.eq span { position: absolute; bottom: 0; width: 18%; background: #46c27a; height: 30%; border-radius: 2px;
  -webkit-animation: eqa 0.9s infinite ease-in-out; animation: eqa 0.9s infinite ease-in-out; }
.eq span:nth-child(1) { left: 4%; }
.eq span:nth-child(2) { left: 28%; -webkit-animation-delay: .2s; animation-delay: .2s; }
.eq span:nth-child(3) { left: 52%; -webkit-animation-delay: .4s; animation-delay: .4s; }
.eq span:nth-child(4) { left: 76%; -webkit-animation-delay: .1s; animation-delay: .1s; }
.paused .eq span { -webkit-animation-play-state: paused; animation-play-state: paused; }
@-webkit-keyframes eqa { 0%,100% { height: 25%; } 50% { height: 100%; } }
@keyframes eqa { 0%,100% { height: 25%; } 50% { height: 100%; } }

#msg { position: absolute; top: 13%; bottom: 14%; left: 0; width: 100%; text-align: center; font-size: 3.4vh; color: #9aa3b5; padding-top: 28vh; display: none; }

/* Player-Leiste */
#player { position: absolute; bottom: 0; left: 0; width: 100%; height: 14%; padding: 1.6vh 3vw; background: #080a0e; border-top: 0.4vh solid #2a3042; }
#plogo { float: left; width: 9vh; height: 9vh; border-radius: 1.4vh; background: #dfe4ee; text-align: center; overflow: hidden; margin-right: 2vw; }
#plogo img { max-width: 86%; max-height: 86%; margin-top: 7%; }
#plogo .badge { line-height: 9vh; font-size: 4vh; }
#pinfo { float: left; width: 60%; }
#pname { font-size: 3.4vh; font-weight: bold; line-height: 4.6vh; white-space: nowrap; overflow: hidden; }
#pstatus { font-size: 2.4vh; line-height: 3.8vh; color: #9aa3b5; }
#pstatus.ok { color: #46c27a; } #pstatus.err { color: #ff6b6b; } #pstatus.load { color: #ffc857; }
#clock { float: right; font-size: 5.4vh; line-height: 9vh; color: #dfe4ee; }

#audio { position: absolute; left: 0; top: 0; width: 1px; height: 1px; opacity: 0; }
</style>
</head>
<body>
<div id="app">
  <div id="head">
    <div id="brand">&#9835; WEBRADIO</div>
    <div id="tabs"></div>
    <div id="hint">&#9664; &#9650; &#9660; &#9654; Navigieren &nbsp; OK Start/Pause</div>
  </div>
  <div id="grid"></div>
  <div id="msg"></div>
  <div id="player">
    <div id="plogo"><div class="badge" style="background:#333">&#9835;</div></div>
    <div id="pinfo"><div id="pname">Kein Sender aktiv</div><div id="pstatus">Bereit</div></div>
    <div id="clock">--:--</div>
  </div>
  <video id="audio" preload="none"></video>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.8/hls.min.js"></script>
<script>
(function () {
  var SERVERS = ['https://de1.api.radio-browser.info', 'https://de2.api.radio-browser.info',
                 'https://nl1.api.radio-browser.info', 'https://at1.api.radio-browser.info'];
  var FAVS = ['WDR 2 Rheinland', '1LIVE', 'WDR 4', 'WDR 5', 'Deutschlandfunk', 'SWR3', 'NDR 2', 'ROCK ANTENNE'];
  var TABS = [
    { label: 'Meine Favoriten' },
    { label: 'Top Deutschland', path: '/stations/bycountrycodeexact/DE?limit=12&order=clickcount&reverse=true&hidebroken=true' },
    { label: 'NRW', path: '/stations/search?countrycode=DE&state=Nordrhein-Westfalen&limit=12&order=clickcount&reverse=true&hidebroken=true' }
  ];
  var COLS = 4;

  var $ = function (id) { return document.getElementById(id); };
  var video = $('audio'), gridEl = $('grid'), tabsEl = $('tabs'), msgEl = $('msg');
  var pname = $('pname'), pstatus = $('pstatus'), plogo = $('plogo');

  var stations = [], tabIdx = 0, tabFocus = 0, fi = 0, zone = 'grid';
  var cur = null, token = 0, hls = null, tileEls = [], tabEls = [];

  /* ---------- API ---------- */
  function getJSON(path, ok, fail, i) {
    i = i || 0;
    if (i >= SERVERS.length) { fail(); return; }
    var url = SERVERS[i] + '/json' + path;
    var next = function () { getJSON(path, ok, fail, i + 1); };
    if (window.fetch) {
      fetch(url).then(function (r) { if (!r.ok) { throw new Error('http'); } return r.json(); }).then(ok, next);
    } else {
      var x = new XMLHttpRequest();
      x.open('GET', url, true);
      x.timeout = 10000;
      x.onload = function () {
        if (x.status === 200) { try { ok(JSON.parse(x.responseText)); } catch (e) { next(); } } else { next(); }
      };
      x.onerror = next; x.ontimeout = next;
      x.send();
    }
  }

  function usable(list) {
    var out = [];
    for (var i = 0; i < list.length; i++) {
      if (list[i] && (list[i].url_resolved || list[i].url)) { out.push(list[i]); }
    }
    return out;
  }

  function loadTab(t) {
    tabIdx = t; token++;
    var my = token;
    stations = []; fi = 0;
    renderTabs(); renderGrid();
    showMsg('Sender werden geladen …');
    function done(list) {
      if (my !== token) { return; }
      stations = usable(list);
      if (!stations.length) { showMsg('Keine Sender gefunden – OK zum Wiederholen'); return; }
      showMsg('');
      renderGrid();
      zone = 'grid'; fi = 0; updateFocus();
    }
    function failed() {
      if (my !== token) { return; }
      showMsg('Fehler beim Laden – Netzwerk prüfen, OK zum Wiederholen');
    }
    if (t === 0) {
      var results = [], left = FAVS.length, any = false;
      for (var k = 0; k < FAVS.length; k++) {
        (function (idx) {
          var p = '/stations/byname/' + encodeURIComponent(FAVS[idx]) + '?limit=1&order=clickcount&reverse=true&hidebroken=true';
          getJSON(p, function (d) { if (d && d[0]) { results[idx] = d[0]; any = true; } finish(); },
                     function () { finish(); });
        })(k);
      }
      var finish = function () {
        left--;
        if (left === 0) {
          if (!any) { failed(); return; }
          var list = [];
          for (var j = 0; j < results.length; j++) { if (results[j]) { list.push(results[j]); } }
          done(list);
        }
      };
    } else {
      getJSON(TABS[t].path, done, failed);
    }
  }

  /* ---------- Rendering ---------- */
  function showMsg(t) { msgEl.innerHTML = ''; msgEl.appendChild(document.createTextNode(t)); msgEl.style.display = t ? 'block' : 'none'; }

  function hue(s) { var h = 0; for (var i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) % 360; } return h; }
  function initials(n) {
    var w = n.replace(/[^A-Za-z0-9ÄÖÜäöü ]/g, ' ').split(/\s+/), r = '';
    for (var i = 0; i < w.length && r.length < 2; i++) { if (w[i]) { r += w[i].charAt(0); } }
    return (r || n.charAt(0) || '?').toUpperCase();
  }
  function badge(name) {
    var b = document.createElement('div');
    b.className = 'badge';
    var h = hue(name);
    b.style.background = 'hsl(' + h + ',55%,38%)';
    b.style.background = '-webkit-linear-gradient(top left, hsl(' + h + ',60%,45%), hsl(' + ((h + 40) % 360) + ',55%,30%))';
    b.appendChild(document.createTextNode(initials(name)));
    return b;
  }
  function fillLogo(box, st) {
    box.innerHTML = '';
    var nm = (st.name || '?').replace(/^\s+|\s+$/g, '');
    if (st.favicon) {
      var img = new Image();
      img.onerror = function () { box.innerHTML = ''; box.appendChild(badge(nm)); };
      img.onload = function () { if (!img.width) { img.onerror(); } };
      img.src = st.favicon;
      box.appendChild(img);
    } else {
      box.appendChild(badge(nm));
    }
  }

  function renderTabs() {
    tabsEl.innerHTML = ''; tabEls = [];
    for (var i = 0; i < TABS.length; i++) {
      var d = document.createElement('div');
      d.className = 'tab' + (i === tabIdx ? ' active' : '');
      d.appendChild(document.createTextNode(TABS[i].label));
      tabsEl.appendChild(d); tabEls.push(d);
    }
    updateFocus();
  }

  function renderGrid() {
    gridEl.innerHTML = ''; tileEls = [];
    var rows = Math.max(2, Math.ceil(stations.length / COLS));
    var h = gridEl.clientHeight / rows;
    for (var i = 0; i < stations.length; i++) {
      var s = stations[i];
      var tile = document.createElement('div'); tile.className = 'tile'; tile.style.height = h + 'px';
      var card = document.createElement('div'); card.className = 'card';
      var logo = document.createElement('div'); logo.className = 'logo'; fillLogo(logo, s);
      var info = document.createElement('div'); info.className = 'info';
      var nm = document.createElement('div'); nm.className = 'sname'; nm.appendChild(document.createTextNode(s.name || 'Unbekannt'));
      var meta = [];
      if (s.codec) { meta.push(s.codec); }
      if (s.bitrate) { meta.push(s.bitrate + ' kbit/s'); }
      var mt = document.createElement('div'); mt.className = 'smeta'; mt.appendChild(document.createTextNode(meta.join(' · ') || ' '));
      info.appendChild(nm); info.appendChild(mt);
      var eq = document.createElement('div'); eq.className = 'eq';
      eq.innerHTML = '<span></span><span></span><span></span><span></span>';
      card.appendChild(logo); card.appendChild(info); card.appendChild(eq);
      tile.appendChild(card); gridEl.appendChild(tile); tileEls.push(tile);
    }
    markPlaying(); updateFocus();
  }

  function setClass(el, cls, on) {
    var c = ' ' + el.className + ' ';
    c = c.replace(' ' + cls + ' ', ' ');
    if (on) { c += cls; }
    el.className = c.replace(/^\s+|\s+$/g, '').replace(/\s+/g, ' ');
  }

  function updateFocus() {
    var i;
    for (i = 0; i < tabEls.length; i++) { setClass(tabEls[i], 'focus', zone === 'tabs' && i === tabFocus); }
    for (i = 0; i < tileEls.length; i++) { setClass(tileEls[i], 'focus', zone === 'grid' && i === fi); }
  }

  function markPlaying() {
    for (var i = 0; i < tileEls.length; i++) {
      var on = cur && stations[i] && stations[i].stationuuid === cur.stationuuid;
      setClass(tileEls[i], 'playing', !!on);
      setClass(tileEls[i], 'paused', !!on && video.paused);
    }
  }

  function setStatus(t, cls) {
    pstatus.innerHTML = ''; pstatus.appendChild(document.createTextNode(t)); pstatus.className = cls || '';
    markPlaying();
  }

  /* ---------- Wiedergabe ---------- */
  function destroyHls() { if (hls) { try { hls.destroy(); } catch (e) {} hls = null; } }

  function safePlay() {
    try { var p = video.play(); if (p && p.catch) { p.catch(function () { setStatus('Fehler', 'err'); }); } }
    catch (e) { setStatus('Fehler', 'err'); }
  }

  function play(st) {
    cur = st;
    pname.innerHTML = ''; pname.appendChild(document.createTextNode(st.name || ''));
    fillLogo(plogo, st);
    setStatus('Lädt …', 'load');
    destroyHls();
    var url = st.url_resolved || st.url;
    var isHls = /\.m3u8(\?|$)/i.test(url);
    var native = !!(video.canPlayType && video.canPlayType('application/vnd.apple.mpegurl'));
    if (isHls && !native && window.Hls && Hls.isSupported()) {
      hls = new Hls();
      hls.on(Hls.Events.ERROR, function (ev, data) { if (data && data.fatal) { setStatus('Fehler', 'err'); } });
      hls.loadSource(url);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, safePlay);
    } else {
      video.src = url;
      try { video.load(); } catch (e) {}
      safePlay();
    }
  }

  function toggle() {
    if (!cur) { return; }
    if (video.paused) { if (hls || video.src) { safePlay(); } else { play(cur); } } else { video.pause(); }
  }
  function stopAll() {
    destroyHls();
    try { video.pause(); video.removeAttribute('src'); video.load(); } catch (e) {}
    setStatus('Gestoppt', '');
  }

  video.addEventListener('playing', function () { setStatus('Spielt', 'ok'); }, false);
  video.addEventListener('pause', function () { if (video.getAttribute('src') || hls) { setStatus('Pausiert', ''); } }, false);
  video.addEventListener('waiting', function () { setStatus('Lädt …', 'load'); }, false);
  video.addEventListener('error', function () { if (video.getAttribute('src')) { setStatus('Fehler', 'err'); } }, false);

  /* ---------- Fernbedienung ---------- */
  function onOk() {
    if (zone === 'tabs') { loadTab(tabFocus); zone = 'grid'; return; }
    if (!stations.length) { loadTab(tabIdx); return; }
    var s = stations[fi];
    if (cur && s.stationuuid === cur.stationuuid) { toggle(); } else { play(s); }
  }

  document.addEventListener('keydown', function (e) {
    var k = e.keyCode, handled = true, n = stations.length;
    if (k === 37) {
      if (zone === 'tabs') { if (tabFocus > 0) { tabFocus--; } } else if (fi % COLS > 0) { fi--; }
    } else if (k === 39) {
      if (zone === 'tabs') { if (tabFocus < TABS.length - 1) { tabFocus++; } } else if (fi % COLS < COLS - 1 && fi + 1 < n) { fi++; }
    } else if (k === 38) {
      if (zone === 'grid') { if (fi - COLS >= 0) { fi -= COLS; } else { zone = 'tabs'; tabFocus = tabIdx; } }
    } else if (k === 40) {
      if (zone === 'tabs') { if (n) { zone = 'grid'; } }
      else if (fi + COLS < n) { fi += COLS; }
      else if (Math.floor(fi / COLS) < Math.floor((n - 1) / COLS)) { fi = n - 1; }
    } else if (k === 13) { onOk(); }
    else if (k === 179 || k === 32) { toggle(); }
    else if (k === 415) { if (cur && video.paused) { toggle(); } }
    else if (k === 19) { if (!video.paused) { video.pause(); } }
    else if (k === 413 || k === 178) { stopAll(); }
    else { handled = false; }
    if (handled) {
      updateFocus();
      if (e.preventDefault) { e.preventDefault(); }
    }
  }, false);

  /* ---------- Uhr ---------- */
  function tick() {
    var d = new Date(), h = d.getHours(), m = d.getMinutes();
    $('clock').innerHTML = (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
  }
  tick(); setInterval(tick, 10000);
  window.onresize = function () { if (stations.length) { renderGrid(); } };

  /* ---------- Start ---------- */
  renderTabs();
  loadTab(0);
})();
</script>
</body>
</html>
